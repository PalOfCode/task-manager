<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Task Manager</title>

    <link rel="stylesheet"
          href="style.css">
          <script src="theme.js"></script>
          
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            Task<span>Manager</span>
        </div>


        <div class="auth-card">

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Create your Task Manager account
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn full-btn">

                    Create Account

                </button>

            </form>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>


   <script src="script.js"></script>

</body>

</html>
