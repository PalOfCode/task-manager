<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Task Manager</title>

    <link rel="stylesheet"
          href="style.css">

 <script src="theme.js"></script>
 
 


</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            Task<span>Manager</span>
        </div>


        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to manage your tasks
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="remember-row">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="primary-btn full-btn">

                    Login

                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>


   <script src="script.js"></script>

</body>

</html>
